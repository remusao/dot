# picom (v10.2). backend=glx = HW-accelerated compositing on the iGPU (xrender is CPU-bound).
# NOTE: libconfig 1.5 (Ubuntu 24.04) rejects trailing commas in arrays — do NOT put a comma
# after the last shadow-exclude entry, or picom fails to start with a "syntax error".
backend = "glx";
vsync = true;

shadow = true;
shadow-radius = 10;
shadow-offset-x = -5;
shadow-offset-y = -5;
shadow-opacity = 0.35;
shadow-exclude = [
    "class_g = 'i3-frame'",
    "class_g = 'i3bar'",
    "_GTK_FRAME_EXTENTS@:c"
];

fading = true;
fade-in-step = 0.15;
fade-out-step = 0.15;

inactive-dim = 0.04;

unredir-if-possible = false;
xinerama-shadow-crop = true;
